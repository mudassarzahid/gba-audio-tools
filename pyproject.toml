[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gba-audio-tools"
dynamic = ["version"]
description = "Extract and render music from GBA ROMs: MP2K (Sappy) and the Webfoot Technologies engine (Legacy of Goku II / Buu's Fury)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mudassar Zahid" }]
keywords = [
    "gba", "gameboy-advance", "chiptune", "vgm", "mp2k", "sappy", "m4a",
    "webfoot", "music", "ripping", "reverse-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/mudassarzahid/gba-audio-tools"
Repository = "https://github.com/mudassarzahid/gba-audio-tools"
Issues = "https://github.com/mudassarzahid/gba-audio-tools/issues"
"Webfoot format notes" = "https://github.com/mudassarzahid/gba-audio-tools/blob/main/docs/webfoot-format.md"

[project.scripts]
gba-audio = "gba_audio.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["gba_audio"]

# Single source of truth for the version: gba_audio.__version__
[tool.setuptools.dynamic]
version = { attr = "gba_audio.__version__" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "ty>=0.0.1a1", "setuptools>=77", "numpy>=1.24"]

# Wheels are built by .github/workflows/release.yml
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32"
test-requires = "pytest"
test-command = "pytest {project}/tests -q"

[tool.ruff]
line-length = 100
extend-exclude = ["core"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ty.environment]
python = "./.venv"

[tool.ty.src]
include = ["src", "tools", "tests"]

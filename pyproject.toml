[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gba-audio-tools"
version = "0.1.0"
description = "Extract and render music from GBA ROMs: MP2K (Sappy) and the Webfoot Technologies engine (Legacy of Goku II / Buu's Fury)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Mudassar Zahid" }]
keywords = [
    "gba", "gameboy-advance", "chiptune", "vgm", "mp2k", "sappy", "m4a",
    "webfoot", "music", "ripping", "reverse-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/mudassarzahid/gba-audio-tools"

[project.scripts]
gba-audio = "gba_audio.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["gba_audio"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "ty>=0.0.1a1", "setuptools>=77", "numpy>=1.24"]

[tool.ruff]
line-length = 100
extend-exclude = ["core"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ty.environment]
python = "./.venv"

[tool.ty.src]
include = ["src", "tools", "tests"]

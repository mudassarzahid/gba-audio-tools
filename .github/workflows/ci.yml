name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: C core, warnings as errors
        run: >
          cc -std=c99 -Wall -Wextra -Werror -Wno-unused-parameter -Icore
          -fsyntax-only
          core/extractor/extractor.c core/extractor/extractor_mp2k.c
          core/extractor/extractor_webfoot.c core/mp2k/mp2k.c
          core/webfoot/webfoot.c
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run python setup.py build_ext --inplace
      - run: uv run pytest tests -q
